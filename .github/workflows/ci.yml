name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        ports:
          - 54329:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobfind_test
        options: >-
          --health-cmd "pg_isready -U postgres -d jobfind_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations no banco de teste
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/jobfind_test
      - run: pnpm test:integration
      # Build único: em CI o webServer do Playwright só sobe o `next start` deste build.
      - run: pnpm build
      - name: Navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Testes E2E
        run: pnpm test:e2e
        env:
          # O seed dos E2E grava direto no Postgres de teste (serviço acima), já migrado.
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/jobfind_test
      - run: pnpm audit --audit-level=high
