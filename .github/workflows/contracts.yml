name: Contratos das fontes

# Valida as APIs reais das fontes (formato do payload e slugs dos boards) uma vez por dia.
# Fica fora do CI de PR de propósito: depende de rede e de serviços de terceiros.
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: contracts
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Testes de contrato
        run: pnpm test:contract
        env:
          # Opcionais: sem o token, o conector não o envia (e a fonte do Himalayas é pulada se exigir chave).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIMALAYAS_API_KEY: ${{ secrets.HIMALAYAS_API_KEY }}
