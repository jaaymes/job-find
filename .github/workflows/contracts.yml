name: Contratos das fontes

# Valida as APIs reais das fontes (formato do payload e slugs dos boards) uma vez por dia.
# Fica fora do CI de PR de propósito: depende de rede e de serviços de terceiros.
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: contracts
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Testes de contrato
        run: pnpm test:contract
        env:
          # Opcionais: sem o token, o conector não o envia (e a fonte do Himalayas é pulada se exigir chave).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIMALAYAS_API_KEY: ${{ secrets.HIMALAYAS_API_KEY }}
