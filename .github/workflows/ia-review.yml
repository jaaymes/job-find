name: Revisão de PR por IA

# Revisa um PR (inclusive de fork) quando um mantenedor aplica o label `ia-review`.
# As instruções do revisor ficam em `.claude/agents/pr-reviewer.md`. Guia: docs/revisao-de-pr.md.
#
# Segurança: `pull_request_target` roda com os segredos do repositório, então:
# - só quem tem acesso de escrita aplica label (a action confere de novo antes de rodar);
# - a raiz do checkout é a main: workflow, instruções e config do Claude nunca vêm do PR;
# - o código do PR fica em `pr-head/` só para leitura. Nenhum passo instala ou executa nada dele;
# - o revisor só lê arquivos e comenta: sem Edit/Write, sem web, sem aprovar nem fazer merge.
on:
  pull_request_target:
    types: [labeled]

permissions: {}

concurrency:
  group: ia-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.label.name == 'ia-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout da main (config confiável)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout do PR em pr-head/ (só leitura, nunca executado)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      - name: Revisão
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          # Token da assinatura Claude (Pro/Max), gerado com `claude setup-token`.
          # Para usar a API paga, troque por: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_fork_prs: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Leia `.claude/agents/pr-reviewer.md` (na raiz, versão da main) e siga essas instruções
            para revisar este PR. A versão do PR está em `pr-head/`; a raiz é a main.

            Publique:
            1. Um comentário inline por achado, com mcp__github_inline_comment__create_inline_comment
               e confirmed=true, usando o caminho relativo à raiz do repositório (sem `pr-head/`).
            2. Um único comentário de resumo no formato das instruções, com `gh pr comment`.

            Não aprove, não peça mudanças pelo sistema de review e não faça merge.
          claude_args: >-
            --max-turns 60
            --add-dir pr-head
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch,Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh api:*),Bash(git push:*)"

      # O label funciona como pedido de revisão: tirá-lo permite pedir outra depois de novos commits.
      - name: Remove o label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/ia-review" || true
